<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clonación de Voz Básica</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  textarea { width: 100%; height: 100px; font-size: 1em; }
  button { margin: 5px; padding: 10px; font-size: 1em; }
  #audioList audio { display: block; margin: 10px 0; }
</style>
</head>
<body>

<h2>Clonación de Voz Básica</h2>

<label for="textInput">Texto para leer (máx 3000 caracteres):</label><br />
<textarea id="textInput" maxlength="3000" placeholder="Escribe aquí..."></textarea><br />

<label for="voiceSelect">Selecciona voz:</label>
<select id="voiceSelect"></select><br />

<button id="speakBtn">Previsualizar Voz</button>
<button id="startRecBtn">Grabar voz</button>
<button id="stopRecBtn" disabled>Detener grabación</button>

<h3>Audios grabados</h3>
<div id="audioList"></div>

<script>
  const synth = window.speechSynthesis;
  const textInput = document.getElementById('textInput');
  const voiceSelect = document.getElementById('voiceSelect');
  const speakBtn = document.getElementById('speakBtn');
  const startRecBtn = document.getElementById('startRecBtn');
  const stopRecBtn = document.getElementById('stopRecBtn');
  const audioList = document.getElementById('audioList');

  let voices = [];
  let mediaRecorder;
  let chunks = [];

  function loadVoices() {
    voices = synth.getVoices();
    voiceSelect.innerHTML = '';
    voices.forEach((voice, i) => {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = `${voice.name} (${voice.lang})`;
      voiceSelect.appendChild(option);
    });
  }
  loadVoices();
  if(speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  speakBtn.addEventListener('click', () => {
    if (synth.speaking) {
      alert('Ya se está reproduciendo una voz.');
      return;
    }
    if (textInput.value.trim() === '') return;

    const utterance = new SpeechSynthesisUtterance(textInput.value);
    utterance.voice = voices[voiceSelect.value];
    synth.speak(utterance);
  });

  startRecBtn.addEventListener('click', async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('Tu navegador no soporta grabación de audio.');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.start();
      chunks = [];

      mediaRecorder.ondataavailable = e => {
        chunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { 'type' : 'audio/wav; codecs=PCM' });
        addAudio(blob);
      };

      startRecBtn.disabled = true;
      stopRecBtn.disabled = false;
    } catch(err) {
      alert('Error al acceder al micrófono: ' + err.message);
    }
  });

  stopRecBtn.addEventListener('click', () => {
    mediaRecorder.stop();
    startRecBtn.disabled = false;
    stopRecBtn.disabled = true;
  });

  function addAudio(blob) {
    const url = URL.createObjectURL(blob);

    const container = document.createElement('div');
    container.style.marginBottom = '15px';

    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = url;

    const downloadBtn = document.createElement('button');
    downloadBtn.textContent = 'Descargar';
    downloadBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = url;
      a.download = 'audio.wav';
      a.click();
    };

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Eliminar';
    deleteBtn.onclick = () => {
      container.remove();
      URL.revokeObjectURL(url);
    };

    container.appendChild(audio);
    container.appendChild(downloadBtn);
    container.appendChild(deleteBtn);

    audioList.appendChild(container);
  }
</script>

</body>
</html>
